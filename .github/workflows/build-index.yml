name: Build games index

on:
  push:
    branches: [main]
    paths:
      - 'games/*/**'            # any file inside a game folder (index.json itself is not matched, so no loop)
      - 'scripts/build_index.py'
  workflow_dispatch:            # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history, needed for the automatic dates

      - name: Build games/index.json
        run: python3 scripts/build_index.py

      - name: Commit the index if it changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add games/index.json
          git diff --staged --quiet || (git commit -m "Update games index" && git push)
