[webp]
; Quality 0-100. Lower = smaller file, more visible loss. 75-85 is a good range.
quality = 70

; true = pixel-perfect (much larger files). When true, "quality" acts as
; compression effort instead of visual quality.
lossless = false

; Encoder effort 0-6. Higher = slightly smaller file but slower. 4 is balanced.
method = 4

; Shrink images so the longest side is at most this many pixels. 0 = keep size.
max_dimension = 0

; Text added to the filename before .webp  (photo.png -> photo_compressed.webp)
suffix =

; Where to save results. Leave blank to save next to the original image.
output_folder =

; Keep the console window open when finished, so you can read the results.
pause_when_done = false
